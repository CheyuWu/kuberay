# Everything a KubeRay release is validated against. Each Item gets its own row in
# results/SUMMARY.md. Change this file when something to validate is added, moved or removed;
# `go run ./release-test stale` then tells the plan skill which units to (re)write.
#
#   id         stable kebab-case slug, also the manifest unit id and the results/<id>/ directory
#   source     a docs.ray.io page (the plan reads its markdown on ray master, following
#              redirects) or a path in this repo
#   procedure  for Items that are not a page or a sample: what to check, in prose
#   requires   what a local kind cluster cannot provide: gpu, tpu, gke, eks, aks, gvisor.
#              A non-empty list means a human runs the Item; the plan and the runner skip it.
#              A page that only uses a cloud cluster as its example has no requires.
#
# Seeded from the v1.7.0 validation sheet: dead pages dropped, URLs moved to the kuberay/ docs
# section, plus the pages and samples the sheet did not list.
