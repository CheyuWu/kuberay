  # Helm charts
  - id: chart-kuberay-operator
    procedure: |
      helm install the kuberay-operator chart at $CHART_VERSION from the kuberay Helm repo.
      The operator Deployment becomes Available running quay.io/kuberay/operator:$KUBERAY_VERSION
      and the ray.io CRDs exist. helm upgrade from the previous release's chart succeeds and the
      new operator reconciles an existing RayCluster. helm uninstall removes the Deployment.
  - id: chart-ray-cluster
    procedure: |
      With the operator installed, helm install the ray-cluster chart at $CHART_VERSION with
      default values. The RayCluster becomes ready with one head and one worker Pod Running.
      helm uninstall removes the RayCluster.
  - id: chart-kuberay-apiserver
    procedure: |
      helm install the kuberay-apiserver chart at $CHART_VERSION. The apiserver Deployment
      becomes Available, and GET /apis/ray.io/v1/namespaces/default/rayclusters through its
      Service returns 200 with a JSON list.

  # Go modules
  - id: go-get-ray-operator
    procedure: |
      In an empty Go module, go get github.com/ray-project/kuberay/ray-operator@$KUBERAY_VERSION
      succeeds, and a main package that imports
      github.com/ray-project/kuberay/ray-operator/apis/ray/v1 and builds a RayCluster value compiles.
  - id: go-get-apiserversdk
    procedure: |
      In an empty Go module, go get github.com/ray-project/kuberay@$KUBERAY_VERSION succeeds, and a
      main package that imports github.com/ray-project/kuberay/apiserversdk compiles.

  # Features without a page or a sample of their own
  - id: multi-host-indexing-labels
    procedure: |
      Apply a RayCluster whose worker group has numOfHosts: 2 and replicas: 2. Each of the four
      worker Pods carries ray.io/worker-group-replica-name (two distinct values, two Pods each),
      ray.io/worker-group-replica-index (0 or 1) and ray.io/replica-host-index (0 or 1, unique
      within a replica).
