# Written by the release-test-plan skill and reviewed like code: one unit per Item in items.yaml.
# Commands use $KUBERAY_VERSION (the tag under test) and $CHART_VERSION (the same without the
# leading "v"), so the file carries over from one release to the next. `go run ./release-test stale`
# lists the units whose source changed since they were planned; only those get re-planned.
units:
  - id: raycluster-quick-start
    source_sha: 6730a0521daafb2bf9533c90ac16ffbfbc7975d0
    notes:
      - "Step 1 (kind create cluster --image=kindest/node:v1.26.0) and Step 6 (killall kubectl; kind delete cluster) are left out: the runner owns the kind cluster and kills the port-forward"
      - "Step 2 follows the linked operator-installation page, Helm method, which installs into ray-system"
      - "kubectl exec -it runs as kubectl exec: the runner has no TTY"
      - "ray job submit runs in the head Pod against its own localhost:8265; the port-forward is exercised by the Step 5 check, which reads the dashboard's /api/jobs/ (the API behind the Recent jobs pane)"
      - "doc-bug: Step 3's output shows MEMORY 3G (and Step 4 shows memory 3000000000.0), and Preparation asks for 4 GB RAM, but since #4588 (v1.7.0) the ray-cluster chart requests 5Gi for the head and 1Gi for the worker, 6Gi in total"
    steps:
      - name: Install the KubeRay operator (operator-installation page, Helm)
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm repo update
          kubectl create namespace ray-system
          helm install kuberay-operator kuberay/kuberay-operator --version $CHART_VERSION -n ray-system
          kubectl wait deploy/kuberay-operator -n ray-system --for=condition=Available --timeout=300s
          kubectl get pods -n ray-system
        check: kubectl wait pod -n ray-system -l app.kubernetes.io/name=kuberay-operator --for=condition=Ready --timeout=60s
      - name: Deploy a RayCluster custom resource
        run: helm install raycluster kuberay/ray-cluster --version $CHART_VERSION
        check: kubectl wait raycluster/raycluster-kuberay --for=jsonpath='{.status.state}'=ready --timeout=900s
        timeout: 900
      - name: View the RayCluster
        run: kubectl get rayclusters
        check: |
          test "$(kubectl get raycluster raycluster-kuberay -o jsonpath='{.status.desiredWorkerReplicas} {.status.availableWorkerReplicas} {.status.desiredCPU}')" = "1 1 2"
      - name: View the RayCluster's Pods
        run: kubectl get pods --selector=ray.io/cluster=raycluster-kuberay
        check: |
          kubectl wait pod -l ray.io/cluster=raycluster-kuberay --for=condition=Ready --timeout=300s
          test "$(kubectl get pods -l ray.io/cluster=raycluster-kuberay,ray.io/node-type=head -o name | wc -l)" -eq 1
          test "$(kubectl get pods -l ray.io/cluster=raycluster-kuberay,ray.io/node-type=worker -o name | wc -l)" -eq 1
      - name: "Method 1: print the cluster resources in the head Pod"
        run: |
          export HEAD_POD=$(kubectl get pods --selector=ray.io/node-type=head -o custom-columns=POD:metadata.name --no-headers)
          echo $HEAD_POD
          kubectl exec $HEAD_POD -- python -c "import ray; ray.init(); print(ray.cluster_resources())"
        check: |
          grep -q "'CPU': 2.0" "$OUT"
          test "$(grep -o "'node:[0-9]" "$OUT" | wc -l)" -eq 2
      - name: "Method 2: view the head Service"
        run: kubectl get service raycluster-kuberay-head-svc
        check: |
          kubectl get service raycluster-kuberay-head-svc -o jsonpath='{.spec.ports[*].port}' | grep -qw 8265
      - name: Port-forward the dashboard port
        run: kubectl port-forward service/raycluster-kuberay-head-svc 8265:8265 >/dev/null 2>&1 &
        check: curl -sf --retry 10 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:8265/api/version
      - name: "Method 2: submit a Ray job"
        run: |
          kubectl exec "$(kubectl get pod -l ray.io/node-type=head -o name)" -- ray job submit --address http://localhost:8265 -- python -c "import ray; ray.init(); print(ray.cluster_resources())"
        check: |
          grep -q "'CPU': 2.0" "$OUT"
          grep -q "Job '.*' succeeded" "$OUT"
      - name: Access the Ray dashboard and see the job in Recent jobs
        run: |
          curl -sf --retry 10 --retry-delay 2 --retry-all-errors -o /dev/null http://127.0.0.1:8265/
          curl -sf --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8265/api/jobs/
        check: |
          test "$(yq -p json -o yaml '[.[] | select(.status == "SUCCEEDED" and (.entrypoint | contains("cluster_resources")))] | length' "$OUT")" -ge 1
    cleanup:
      - helm uninstall raycluster --wait
      - helm uninstall kuberay-operator -n ray-system --wait
      - kubectl delete crd rayclusters.ray.io rayjobs.ray.io rayservices.ray.io raycronjobs.ray.io --ignore-not-found
      - kubectl delete namespace ray-system --ignore-not-found

  - id: rayjob-quick-start
    source_sha: 93fca526ae0c27e6dc071f37d150221f4bda2dfd
    notes:
      - "Step 1 (kind create cluster --image=kindest/node:v1.26.0) and Step 10.3 (kind delete cluster) are left out: the runner owns the kind cluster"
      - "Step 2 follows the linked operator-installation page, Helm method, which installs into ray-system"
      - "The RayJob Configuration section is reference text without commands; only the example (Steps 3 to 10) runs"
      - "Step 5: kubectl logs with a selector prints only the last 10 lines per Pod; the check looks for the last counter line and the succeeded line, which are among them"
      - "doc-bug: Step 10.2 runs helm uninstall kuberay-operator without -n ray-system, but the operator-installation page that Step 2 links to installs the release into ray-system, so the command fails with release: not found; cleanup passes -n ray-system"
      - "doc-bug: Step 4.2's example output shows CPUS 400m and MEMORY 0, but ray-job.sample.yaml requests 1 CPU and 2Gi for the head and 200m CPU for the worker, so the RayCluster reports 1200m and 2Gi"
      - "doc-bug: RayJob Configuration says submissionMode has three possible values, then lists four (K8sJobMode, HTTPMode, InteractiveMode, SidecarMode)"
    steps:
      - name: Install the KubeRay operator (operator-installation page, Helm)
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm repo update
          kubectl create namespace ray-system
          helm install kuberay-operator kuberay/kuberay-operator --version $CHART_VERSION -n ray-system
          kubectl wait deploy/kuberay-operator -n ray-system --for=condition=Available --timeout=300s
          kubectl get pods -n ray-system
        check: kubectl wait pod -n ray-system -l app.kubernetes.io/name=kuberay-operator --for=condition=Ready --timeout=60s
      - name: "Step 3: Install a RayJob"
        run: kubectl apply -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-job.sample.yaml
        check: kubectl wait rayjob/rayjob-sample --for=jsonpath='{.status.jobDeploymentStatus}'=Complete --timeout=900s
        timeout: 900
      - name: "Step 4.1: List the RayJobs"
        run: kubectl get rayjob
        check: |
          test "$(kubectl get rayjob rayjob-sample -o jsonpath='{.status.jobStatus} {.status.jobDeploymentStatus}')" = "SUCCEEDED Complete"
          test "$(kubectl get rayjob rayjob-sample -o jsonpath='{.status.rayClusterName} {.status.startTime} {.status.endTime}' | wc -w)" -eq 3
      - name: "Step 4.2: List the RayClusters"
        run: kubectl get raycluster
        check: |
          kubectl get rayjob rayjob-sample -o jsonpath='{.status.rayClusterName}' >rayjob-sample.raycluster
          test "$(kubectl get raycluster "$(cat rayjob-sample.raycluster)" -o jsonpath='{.status.desiredWorkerReplicas} {.status.availableWorkerReplicas} {.status.state}')" = "1 1 ready"
      - name: "Step 4.3: List the Pods"
        run: kubectl get pods
        check: |
          RC=$(cat rayjob-sample.raycluster)
          test "$(kubectl get pods -l job-name=rayjob-sample --field-selector=status.phase=Succeeded -o name | wc -l)" -ge 1
          test "$(kubectl get pods -l ray.io/cluster=$RC,ray.io/node-type=head --field-selector=status.phase=Running -o name | wc -l)" -eq 1
          test "$(kubectl get pods -l ray.io/cluster=$RC,ray.io/node-type=worker --field-selector=status.phase=Running -o name | wc -l)" -eq 1
      - name: "Step 4.4: Check the status of the RayJob"
        run: |
          kubectl get rayjobs.ray.io rayjob-sample -o jsonpath='{.status.jobStatus}'
          kubectl get rayjobs.ray.io rayjob-sample -o jsonpath='{.status.jobDeploymentStatus}'
        check: |
          grep -q SUCCEEDED "$OUT"
          grep -q Complete "$OUT"
      - name: "Step 5: Check the output of the Ray job"
        run: kubectl logs -l=job-name=rayjob-sample
        check: |
          grep -q 'test_counter got 5' "$OUT"
          grep -qE "Job '.*' succeeded" "$OUT"
      - name: "Step 6: Delete the RayJob"
        run: kubectl delete -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-job.sample.yaml
        check: kubectl wait --for=delete rayjob/rayjob-sample "raycluster/$(cat rayjob-sample.raycluster)" --timeout=300s
      - name: "Step 7: Create a RayJob with shutdownAfterJobFinishes set to true"
        run: kubectl apply -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-job.shutdown.yaml
        check: |
          test "$(kubectl get rayjob rayjob-sample-shutdown -o jsonpath='{.spec.shutdownAfterJobFinishes} {.spec.ttlSecondsAfterFinished}')" = "true 10"
          kubectl wait rayjob/rayjob-sample-shutdown --for=jsonpath='{.status.jobDeploymentStatus}'=Complete --timeout=900s
        timeout: 900
      - name: "Step 8: Check the RayJob status"
        run: |
          kubectl get rayjobs.ray.io rayjob-sample-shutdown -o jsonpath='{.status.jobDeploymentStatus}'
          kubectl get rayjobs.ray.io rayjob-sample-shutdown -o jsonpath='{.status.jobStatus}'
        check: |
          grep -q Complete "$OUT"
          grep -q SUCCEEDED "$OUT"
      - name: "Step 9: The KubeRay operator deletes the RayCluster and keeps the submitter Job"
        run: kubectl get raycluster
        check: |
          RC=$(kubectl get rayjob rayjob-sample-shutdown -o jsonpath='{.status.rayClusterName}')
          test -n "$RC"
          kubectl wait --for=delete "raycluster/$RC" --timeout=120s
          kubectl get job rayjob-sample-shutdown
      - name: "Step 10.1: Delete the RayJob, which deletes the submitter Job through its owner reference"
        run: kubectl delete -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-job.shutdown.yaml
        check: kubectl wait --for=delete rayjob/rayjob-sample-shutdown job/rayjob-sample-shutdown --timeout=120s
    cleanup:
      - kubectl delete -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-job.sample.yaml --ignore-not-found
      - kubectl delete -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-job.shutdown.yaml --ignore-not-found
      - helm uninstall kuberay-operator -n ray-system --wait
      - kubectl delete crd rayclusters.ray.io rayjobs.ray.io rayservices.ray.io raycronjobs.ray.io --ignore-not-found
      - kubectl delete namespace ray-system --ignore-not-found

  - id: kubectl-plugin
    source_sha: 9d32cf30cd402b16ca316889aa1b2696a74ee592
    notes:
      - "Krew is left out: kubectl-plugin-release.yaml only updates krew-index for stable tags, so Krew cannot install a release candidate; the plugin comes from the GitHub release instead"
      - "The binary goes to $WORK/bin instead of ~/.local/bin (the page says any directory on PATH will do), so the runner host's own kubectl-ray is left alone; every step that runs kubectl ray puts that directory first on PATH. The tarball is linux_amd64, as on the page"
      - "Requests are lowered to fit a kind node: the page's defaults (2 CPU / 4Gi for the head and each worker) need about 10 CPU for raycluster-sample and raycluster-sample-2 alone. create cluster runs with head 500m/3Gi and workers 500m/1Gi, example-group gets 500m/2Gi instead of 5Gi, and job submit runs with head 1/3Gi and worker 1/1Gi. The two defaults tables are checked with --dry-run instead"
      - "raycluster-sample-3 takes its worker CPU (3) from the config file, and --file rejects resource flags, so the unit checks its spec and deletes it before going on; its later outputs on the page do not show it either"
      - "kubectl ray session runs in the background and is stopped (the page's Ctrl-C) before kubectl ray log, because kubectl ray job submit port-forwards 8265 itself later"
      - "kubectl ray job submit waits only 120s for the RayCluster to become ready (clusterTimeout in job_submit.go). It passes because Example 1 already pulled the plugin's default image; if ray-job.interactive-mode.yaml's image ever differs from the plugin default, a cold pull can exceed that"
      - "The Shell Completion section only links to an external project and is not exercised"
      - "doc-bug: both defaults tables say ray version 2.46.0, but the plugin's default is util.RayVersion (2.52.0 at HEAD)"
      - "doc-bug: Example 2 downloads ray-job.interactive-mode.yaml from refs/heads/master; the unit uses $KUBERAY_VERSION"
      - "doc-bug: Example 2 does not say that kubectl ray job submit needs the ray CLI installed locally (it runs ray job submit). The unit installs ray[default] at the plugin's default Ray version into $WORK/venv with uv, so the runner host needs uv"
      - "doc-bug: kubectl ray delete asks (y/yes/n/no) unless -y is given, and the page's examples neither show the prompt nor pass -y; the unit pipes y into it"
      - "doc-bug: Example 1's cleanup deletes raycluster-sample and raycluster-sample-2 but not raycluster-sample-3"
      - "doc-bug: the example outputs are stale. create prints Created Ray cluster (lowercase c), scale prints Updated worker group ... (Scaled Replicas: 1 to 2), get cluster has CONDITION and STATUS columns, and get workergroup has MIN and MAX columns"
    steps:
      - name: Install the KubeRay operator (operator-installation page, Helm)
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm repo update
          kubectl create namespace ray-system
          helm install kuberay-operator kuberay/kuberay-operator --version $CHART_VERSION -n ray-system
          kubectl wait deploy/kuberay-operator -n ray-system --for=condition=Available --timeout=300s
          kubectl get pods -n ray-system
        check: kubectl wait pod -n ray-system -l app.kubernetes.io/name=kuberay-operator --for=condition=Ready --timeout=60s
      - name: Download the plugin from GitHub releases
        run: |
          curl -LO https://github.com/ray-project/kuberay/releases/download/$KUBERAY_VERSION/kubectl-ray_${KUBERAY_VERSION}_linux_amd64.tar.gz
          tar -xvf kubectl-ray_${KUBERAY_VERSION}_linux_amd64.tar.gz
          mkdir -p bin
          cp kubectl-ray bin
        check: |
          export PATH="$PWD/bin:$PATH"
          kubectl ray version | grep -qx "kubectl ray plugin version: $KUBERAY_VERSION"
      - name: Usage
        run: |
          export PATH="$PWD/bin:$PATH"
          kubectl ray --help
        check: |
          for c in create get scale session log delete job; do grep -qE "^\s+$c\s" "$OUT"; done
      - name: "Example 1: the create cluster defaults table (dry run)"
        run: |
          export PATH="$PWD/bin:$PATH"
          kubectl ray create cluster raycluster-sample --dry-run >create-cluster-defaults.yaml
          cat create-cluster-defaults.yaml
        check: |
          F=create-cluster-defaults.yaml
          test "$(yq '.spec.headGroupSpec.template.spec.containers[0].image' $F)" = "rayproject/ray:$(yq '.spec.rayVersion' $F)"
          test "$(yq '.spec.headGroupSpec.template.spec.containers[0].resources.requests.cpu' $F)" = 2
          test "$(yq '.spec.headGroupSpec.template.spec.containers[0].resources.requests.memory' $F)" = 4Gi
          test "$(yq '.spec.workerGroupSpecs[0].replicas' $F)" = 1
          test "$(yq '.spec.workerGroupSpecs[0].numOfHosts' $F)" = 1
          test "$(yq '.spec.workerGroupSpecs[0].template.spec.containers[0].resources.requests.cpu' $F)" = 2
          test "$(yq '.spec.workerGroupSpecs[0].template.spec.containers[0].resources.requests.memory' $F)" = 4Gi
          test "$(yq '.spec.enableInTreeAutoscaling // false' $F)" = false
      - name: "Example 1: create a RayCluster"
        run: |
          export PATH="$PWD/bin:$PATH"
          kubectl ray create cluster raycluster-sample --head-cpu 500m --head-memory 3Gi --worker-cpu 500m --worker-memory 1Gi
        check: kubectl wait raycluster/raycluster-sample --for=jsonpath='{.status.state}'=ready --timeout=900s
        timeout: 900
      - name: Create a RayCluster with 2 workers
        run: |
          export PATH="$PWD/bin:$PATH"
          kubectl ray create cluster raycluster-sample-2 --worker-replicas 2 --head-cpu 500m --head-memory 3Gi --worker-cpu 500m --worker-memory 1Gi
        check: |
          kubectl wait raycluster/raycluster-sample-2 --for=jsonpath='{.status.state}'=ready --timeout=600s
          test "$(kubectl get raycluster raycluster-sample-2 -o jsonpath='{.status.availableWorkerReplicas}')" -eq 2
        timeout: 600
      - name: Create a RayCluster from a config file that sets the worker CPU to 3
        run: |
          export PATH="$PWD/bin:$PATH"
          curl -LO https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/kubectl-plugin/config/samples/create-cluster.sample.yaml
          kubectl ray create cluster raycluster-sample-3 --file create-cluster.sample.yaml
        check: |
          test "$(kubectl get raycluster raycluster-sample-3 -o jsonpath='{.spec.workerGroupSpecs[0].template.spec.containers[0].resources.requests.cpu}')" = 3
      - name: Delete raycluster-sample-3 to free its 5 CPU (not on the page)
        run: kubectl delete raycluster raycluster-sample-3
        check: kubectl wait --for=delete pod -l ray.io/cluster=raycluster-sample-3 --timeout=300s
      - name: Add a worker group to raycluster-sample
        run: |
          export PATH="$PWD/bin:$PATH"
          kubectl ray create workergroup example-group --ray-cluster raycluster-sample --worker-cpu 500m --worker-memory 2Gi
        check: |
          test "$(kubectl get raycluster raycluster-sample -o jsonpath='{.spec.workerGroupSpecs[?(@.groupName=="example-group")].template.spec.containers[0].resources.requests.memory}')" = 2Gi
          kubectl wait raycluster/raycluster-sample --for=jsonpath='{.status.availableWorkerReplicas}'=2 --timeout=600s
        timeout: 600
      - name: kubectl ray get cluster
        run: |
          export PATH="$PWD/bin:$PATH"
          kubectl ray get cluster
        check: |
          grep -qE '^raycluster-sample\s+default\s+2\s+2\s' "$OUT"
          grep -qE '^raycluster-sample-2\s+default\s+2\s+2\s' "$OUT"
      - name: kubectl ray get workergroup
        run: |
          export PATH="$PWD/bin:$PATH"
          kubectl ray get workergroup
        check: |
          test "$(grep -cE '^default-group\s' "$OUT")" -eq 2
          grep -qE '^example-group\s.*\s2Gi\s+raycluster-sample\s*$' "$OUT"
          grep -qE '^default-group\s.*\s2/2\s.*\sraycluster-sample-2\s*$' "$OUT"
      - name: kubectl ray get nodes
        run: |
          export PATH="$PWD/bin:$PATH"
          kubectl ray get nodes
        check: |
          test "$(grep -cE '\sraycluster-sample\s+head\s' "$OUT")" -eq 1
          test "$(grep -cE '\sraycluster-sample\s+worker\s' "$OUT")" -eq 2
          test "$(grep -cE '\sraycluster-sample-2\s+head\s' "$OUT")" -eq 1
          test "$(grep -cE '\sraycluster-sample-2\s+worker\s+default-group\s' "$OUT")" -eq 2
      - name: Scale a worker group
        run: |
          export PATH="$PWD/bin:$PATH"
          kubectl ray scale cluster raycluster-sample \
            --worker-group default-group \
            --replicas 2
        check: |
          test "$(kubectl get raycluster raycluster-sample -o jsonpath='{.spec.workerGroupSpecs[?(@.groupName=="default-group")].replicas}')" -eq 2
          kubectl wait raycluster/raycluster-sample --for=jsonpath='{.status.availableWorkerReplicas}'=3 --timeout=600s
        timeout: 600
      - name: Verify the worker group scaled up
        run: |
          export PATH="$PWD/bin:$PATH"
          kubectl ray get workergroup default-group --ray-cluster raycluster-sample
        check: grep -qE '^default-group\s+\S+\s+\S+\s+2/2\s' "$OUT"
      - name: kubectl ray session forwards the dashboard and client ports
        run: |
          export PATH="$PWD/bin:$PATH"
          kubectl ray session raycluster-sample >session.log 2>&1 &
          echo $! >session.pid
        check: |
          curl -sf --retry 10 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:8265/api/version
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/10001'
          grep -q 'Forwarding ports to service raycluster-sample-head-svc' session.log
          grep -q 'Ray Dashboard: http://localhost:8265' session.log
          grep -q 'Ray Interactive Client: http://localhost:10001' session.log
      - name: Stop the session (Ctrl-C)
        run: kill "$(cat session.pid)"
        check: |
          for _ in $(seq 30); do
            curl -s -o /dev/null --max-time 2 http://localhost:8265/ || exit 0
            sleep 1
          done
          exit 1
        timeout: 60
      - name: kubectl ray log
        run: |
          export PATH="$PWD/bin:$PATH"
          kubectl ray log raycluster-sample
        check: |
          PODS=$(kubectl get pods -l ray.io/cluster=raycluster-sample -o name | wc -l)
          test "$(grep -c 'Downloading log for Ray Node' "$OUT")" -eq "$PODS"
          test "$(find raycluster-sample -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq "$PODS"
          for d in raycluster-sample/*/; do test -s "$d/stdout.log"; test -e "$d/raylet.out"; done
      - name: Delete the RayClusters
        run: |
          export PATH="$PWD/bin:$PATH"
          echo y | kubectl ray delete raycluster-sample
          echo y | kubectl ray delete raycluster-sample-2
        check: |
          kubectl wait --for=delete raycluster/raycluster-sample raycluster/raycluster-sample-2 --timeout=120s
          kubectl wait --for=delete pod -l 'ray.io/cluster in (raycluster-sample,raycluster-sample-2)' --timeout=300s
      - name: "Example 2: write sample_code.py and install the ray CLI that job submit runs"
        run: |
          mkdir -p job
          cat >job/sample_code.py <<'EOF'
          import ray
          ray.init(address="auto")

          @ray.remote
          def f(x):
              return x * x

          futures = [f.remote(i) for i in range(4)]
          print(ray.get(futures)) # [0, 1, 4, 9]
          EOF
          uv venv --python 3.12 venv
          uv pip install --python venv/bin/python "ray[default]==$(yq '.spec.rayVersion' create-cluster-defaults.yaml)"
          ln -sf ../venv/bin/ray bin/ray
        check: bin/ray --version | grep -qF "version $(yq '.spec.rayVersion' create-cluster-defaults.yaml)"
        timeout: 900
      - name: "Example 2: the job submit defaults table (dry run)"
        run: |
          export PATH="$PWD/bin:$PATH"
          cd job
          kubectl ray job submit --dry-run --name rayjob-sample --working-dir . -- python sample_code.py >../job-submit-dry-run.out
          cat ../job-submit-dry-run.out
        check: |
          sed -n '/^apiVersion:/,$p' job-submit-dry-run.out >job-submit-defaults.yaml
          F=job-submit-defaults.yaml
          S=.spec.rayClusterSpec
          test "$(yq "$S.headGroupSpec.template.spec.containers[0].image" $F)" = "rayproject/ray:$(yq "$S.rayVersion" $F)"
          test "$(yq "$S.headGroupSpec.template.spec.containers[0].resources.requests.cpu" $F)" = 2
          test "$(yq "$S.headGroupSpec.template.spec.containers[0].resources.requests.memory" $F)" = 4Gi
          test "$(yq "$S.workerGroupSpecs[0].replicas" $F)" = 1
          test "$(yq "$S.workerGroupSpecs[0].template.spec.containers[0].resources.requests.cpu" $F)" = 2
          test "$(yq "$S.workerGroupSpecs[0].template.spec.containers[0].resources.requests.memory" $F)" = 4Gi
          test "$(yq '.spec.ttlSecondsAfterFinished // 0' $F)" = 0
          test "$(yq '.spec.preRunningDeadlineSeconds // 0' $F)" = 0
      - name: Submit a Ray job without a YAML file
        run: |
          export PATH="$PWD/bin:$PATH"
          cd job
          kubectl ray job submit --name rayjob-sample --working-dir . --head-cpu 1 --head-memory 3Gi --worker-cpu 1 --worker-memory 1Gi -- python sample_code.py
        check: |
          grep -qF '[0, 1, 4, 9]' "$OUT"
          grep -qE "Job '.*' succeeded" "$OUT"
          test "$(kubectl get rayjob rayjob-sample -o jsonpath='{.status.jobStatus}')" = SUCCEEDED
          kubectl get rayjob rayjob-sample -o jsonpath='{.status.rayClusterName}' >rayjob-sample.raycluster
          test -s rayjob-sample.raycluster
        timeout: 600
      - name: Download the InteractiveMode RayJob YAML
        run: |
          cd job
          wget https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-job.interactive-mode.yaml
        check: test "$(yq '.spec.submissionMode' job/ray-job.interactive-mode.yaml)" = InteractiveMode
      - name: Submit a Ray job with the RayJob YAML
        run: |
          export PATH="$PWD/bin:$PATH"
          cd job
          kubectl ray job submit -f ray-job.interactive-mode.yaml --working-dir . -- python sample_code.py
        check: |
          grep -qF '[0, 1, 4, 9]' "$OUT"
          grep -qE "Job '.*' succeeded" "$OUT"
          test "$(kubectl get rayjob rayjob-interactive-mode -o jsonpath='{.status.jobStatus}')" = SUCCEEDED
          kubectl get rayjob rayjob-interactive-mode -o jsonpath='{.status.rayClusterName}' >rayjob-interactive-mode.raycluster
          test -s rayjob-interactive-mode.raycluster
        timeout: 600
      - name: Delete the RayJobs
        run: |
          export PATH="$PWD/bin:$PATH"
          echo y | kubectl ray delete rayjob/rayjob-sample
          echo y | kubectl ray delete rayjob/rayjob-interactive-mode
        check: |
          kubectl wait --for=delete rayjob/rayjob-sample rayjob/rayjob-interactive-mode --timeout=120s
          kubectl wait --for=delete "raycluster/$(cat rayjob-sample.raycluster)" "raycluster/$(cat rayjob-interactive-mode.raycluster)" --timeout=300s
    cleanup:
      - kubectl delete rayjob rayjob-sample rayjob-interactive-mode --ignore-not-found
      - kubectl delete raycluster raycluster-sample raycluster-sample-2 raycluster-sample-3 --ignore-not-found
      - helm uninstall kuberay-operator -n ray-system --wait
      - kubectl delete crd rayclusters.ray.io rayjobs.ray.io rayservices.ray.io raycronjobs.ray.io --ignore-not-found
      - kubectl delete namespace ray-system --ignore-not-found

  - id: ray-cluster-sample
    source_sha: 1d35341e539132725fa424f070e3ec660396b527
    notes:
      - "sample-bug: the worker group's comment says it is called small-group, but groupName is workergroup"
    steps:
      - name: Install the KubeRay operator (operator-installation page, Helm)
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm repo update
          kubectl create namespace ray-system
          helm install kuberay-operator kuberay/kuberay-operator --version $CHART_VERSION -n ray-system
          kubectl wait deploy/kuberay-operator -n ray-system --for=condition=Available --timeout=300s
        check: kubectl wait pod -n ray-system -l app.kubernetes.io/name=kuberay-operator --for=condition=Ready --timeout=60s
      - name: Apply the sample
        run: kubectl apply -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-cluster.sample.yaml
        check: kubectl wait raycluster/raycluster-kuberay --for=jsonpath='{.status.state}'=ready --timeout=900s
        timeout: 900
      - name: One head Pod and one worker Pod run
        run: kubectl get pods -l ray.io/cluster=raycluster-kuberay
        check: |
          test "$(kubectl get pods -l ray.io/cluster=raycluster-kuberay,ray.io/node-type=head --field-selector=status.phase=Running -o name | wc -l)" -eq 1
          test "$(kubectl get pods -l ray.io/cluster=raycluster-kuberay,ray.io/node-type=worker --field-selector=status.phase=Running -o name | wc -l)" -eq 1
      - name: The head and the worker form one Ray cluster
        run: |
          kubectl exec "$(kubectl get pod -l ray.io/cluster=raycluster-kuberay,ray.io/node-type=head -o name)" -- python -c "import ray; ray.init(); print('alive_nodes', sum(n['Alive'] for n in ray.nodes())); print(ray.cluster_resources())"
        check: |
          grep -qx 'alive_nodes 2' "$OUT"
          grep -q "'CPU': 2.0" "$OUT"
    cleanup:
      - kubectl delete -f https://raw.githubusercontent.com/ray-project/kuberay/$KUBERAY_VERSION/ray-operator/config/samples/ray-cluster.sample.yaml --ignore-not-found
      - helm uninstall kuberay-operator -n ray-system --wait
      - kubectl delete crd rayclusters.ray.io rayjobs.ray.io rayservices.ray.io raycronjobs.ray.io --ignore-not-found
      - kubectl delete namespace ray-system --ignore-not-found

  - id: go-get-ray-operator
    source_sha: 5e7967e40029750ea790ebd45aaee812bcd8b1db
    notes:
      - "Needs no cluster, only go on the runner host. With GOTOOLCHAIN=auto (the default), go fetches the toolchain that ray-operator/go.mod asks for (go 1.26.0 at HEAD)"
      - "go get resolves @$KUBERAY_VERSION through the tag ray-operator/$KUBERAY_VERSION, because the module lives in a subdirectory. docs/development/release.md only creates vX.Y.Z, so a failure in step 1 most likely means the ray-operator/ tag was not pushed"
    steps:
      - name: go get the ray-operator module in an empty Go module
        run: |
          mkdir gomod && cd gomod
          go mod init example.com/raycluster
          go get github.com/ray-project/kuberay/ray-operator@$KUBERAY_VERSION
        check: |
          cd gomod
          test "$(go list -m -f '{{.Version}}' github.com/ray-project/kuberay/ray-operator)" = "$KUBERAY_VERSION"
        timeout: 600
      - name: A main package that imports apis/ray/v1 and builds a RayCluster value compiles
        run: |
          cd gomod
          cat >main.go <<'EOF'
          package main

          import (
          	"fmt"

          	metav1 "k8s.io/apimachinery/pkg/apis/meta/v1"

          	rayv1 "github.com/ray-project/kuberay/ray-operator/apis/ray/v1"
          )

          func main() {
          	cluster := rayv1.RayCluster{
          		ObjectMeta: metav1.ObjectMeta{Name: "raycluster-go-get"},
          		Spec: rayv1.RayClusterSpec{
          			HeadGroupSpec:    rayv1.HeadGroupSpec{RayStartParams: map[string]string{}},
          			WorkerGroupSpecs: []rayv1.WorkerGroupSpec{{GroupName: "workergroup"}},
          		},
          	}
          	fmt.Println(cluster.Name, len(cluster.Spec.WorkerGroupSpecs))
          }
          EOF
          go mod tidy
          go build -buildvcs=false -o raycluster .
          ./raycluster
        check: grep -qx 'raycluster-go-get 1' "$OUT"
        timeout: 600
